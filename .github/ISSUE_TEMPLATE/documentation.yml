name: Documentation issue
description: Report outdated, unclear, or missing documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: location
    attributes:
      label: Document location
      description: Link or path to the affected document.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is outdated, unclear, or missing?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested update
      description: What should the document say instead?
