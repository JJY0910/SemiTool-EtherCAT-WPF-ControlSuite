name: .NET CI

on:
  push:
    branches:
      - main
      - codex/**
      - fix/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SemiTool.EtherCAT.WPF.ControlSuite.sln

      - name: Build
        run: dotnet build SemiTool.EtherCAT.WPF.ControlSuite.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SemiTool.EtherCAT.WPF.ControlSuite.sln --configuration Release --no-build --no-restore
